format_version = 1
id = "iog.enhancements"
version = "1.0.0"
name = "Gameplay enhancements"
author = "mr0ta"
description = "Quality-of-life additions. Based on the GaiaLabs enhancement patches (documentation only; reimplemented here)."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "illusionofgaiausa-usa"
rom_sha256 = "32adc048fd89228a4310c03df243e83de7d436cdb2460b4cc83ade20d359b2bd"

[[feature]]
id = "run"
name = "Run button"
description = "Hold the run button with a direction to sprint (Will's dash), wherever you can move."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "run"
id = "button"
label = "Run button"
type = "choice"
default = "Y"

[[option.choice]]
value = "Y"
label = "Y"

[[option.choice]]
value = "X"
label = "X"

[[option]]
feature = "run"
id = "style"
label = "Style"
type = "choice"
default = "auto"

[[option.choice]]
value = "auto"
label = "Auto-run: walk to build speed, hold the run button to start sooner (from Drewish's Gaia and Time)"

[[option.choice]]
value = "hold"
label = "Hold: hold the run button to sprint at once"

[[plugin]]
feature = "run"
id = "iog.run"

[[feature]]
id = "hotswap"
name = "Item hotswapping"
description = "Hold the modifier and press L or R to equip the previous or next item without opening the menu."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "hotswap"
id = "modifier"
label = "Hold"
type = "choice"
default = "X"

[[option.choice]]
value = "X"
label = "X"

[[option.choice]]
value = "Y"
label = "Y"

[[option.choice]]
value = "Select"
label = "Select"

[[plugin]]
feature = "hotswap"
id = "iog.hotswap"

[[feature]]
id = "msu1"
name = "MSU-1 soundtrack"
description = "Play the music from an MSU-1 pack for Illusion of Gaia (CD-quality 44.1 kHz). Sound effects stay the game's own. Songs the pack lacks play as usual. Off until you import a pack on the launcher's Soundtrack page, which turns it on."
group = "Audio"
default_enabled = false

[[resource]]
feature = "msu1"
id = "pack"
label = "MSU-1 pack folder"
description = "The folder with the pack's <name>-<N>.pcm tracks. Leave it empty to use the msu1 folder beside the game."
format = "directory"
identity = "snes.msu1.pack"
required = false

[[plugin]]
feature = "msu1"
id = "iog.msu1"

[[feature]]
id = "stacking"
name = "Item stacking"
description = "Red Jewels, Herbs and Crystals share one inventory slot each, with a counter on the inventory screen."
group = "Inventory"
default_enabled = false

[[plugin]]
feature = "stacking"
id = "iog.stacking"

[[feature]]
id = "equipped"
name = "Equipped indicator"
description = "Frame the equipped item on the inventory screen."
group = "Inventory"
default_enabled = false

[[plugin]]
feature = "equipped"
id = "iog.equipped"

[[feature]]
id = "ngplus"
name = "New Game Plus"
description = "Finish the game with this on and that save file becomes a New Game Plus: continuing it starts the journey again keeping Will's stats and abilities (story, dungeons and items reset)."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "ngplus"
id = "iog.ngplus"

[[feature]]
id = "hold_advance"
name = "Hold to advance dialogue"
description = "Keep the confirm button (A, B or Y) held to go through dialogue pages one after another instead of pressing for each. Questions (yes/no and other choices) always wait for a real press."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "hold_advance"
id = "speed"
label = "Speed"
type = "choice"
default = "normal"

[[option.choice]]
value = "slow"
label = "Slow"

[[option.choice]]
value = "normal"
label = "Normal"

[[option.choice]]
value = "fast"
label = "Fast"

[[plugin]]
feature = "hold_advance"
id = "iog.hold_advance"

[[feature]]
id = "text_speed"
name = "Text speed"
description = "How fast dialogue types out. Hold the run button to hurry any line. Normal keeps the game's own pacing; Cinematic types plain lines one letter per frame; Instant shows every line at once. From Drewish's Gaia and Time."
group = "Gameplay"
default_enabled = true

[[option]]
feature = "text_speed"
id = "speed"
label = "Speed"
type = "choice"
default = "normal"

[[option.choice]]
value = "normal"
label = "Normal"

[[option.choice]]
value = "cinematic"
label = "Cinematic"

[[option.choice]]
value = "instant"
label = "Instant"

[[plugin]]
feature = "text_speed"
id = "iog.text_speed"

[[feature]]
id = "rumble"
name = "Controller rumble"
description = "Player 1's controller rumbles when Will is hit (harder hits rumble harder), longer when he falls, and lightly when the ground shakes. Keyboard play has no rumble. Loading a state, rewinding or resetting never rumbles."
group = "Gameplay"
default_enabled = true

[[option]]
feature = "rumble"
id = "strength"
label = "Strength"
type = "choice"
default = "normal"

[[option.choice]]
value = "low"
label = "Low"

[[option.choice]]
value = "normal"
label = "Normal"

[[option.choice]]
value = "strong"
label = "Strong"

[[plugin]]
feature = "rumble"
id = "iog.rumble"

[[feature]]
id = "auto_use"
name = "Use key items on the spot"
description = "Press A where a key item you carry does something (a statue on its pedestal, a key at its door, the Crystal Ball, the Purification Stone and the rest) and Will uses it, without equipping it first. Melodies and hieroglyphs still work as usual. After andrewclunn's Gaia and Time."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "auto_use"
id = "iog.auto_use"

[[feature]]
id = "jewel_sparkles"
name = "Red Jewel sparkles"
description = "A twinkle of light marks each hidden Red Jewel you have not found yet, and the people who would give you one. Nothing else changes: the jewels are where they always were. After andrewclunn's Gaia and Time."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "jewel_sparkles"
id = "iog.jewel_sparkles"

[[feature]]
id = "world_map"
name = "Enhanced world map"
description = "On the walkable world map: a smoother map picture with a hazed horizon, a higher camera that shows more of the land, markers over the places you can visit, a small map with your position, and a clearer entry prompt. You also get control sooner after leaving a town. Off: the original walking view; in Wide view that includes the original's coarse ground with its horizontal streaks."
group = "Presentation"
default_enabled = true

[[plugin]]
feature = "world_map"
id = "iog.world_map"

# Title-owned presentation controls. Physical controller remapping remains in
# the shared launcher's Controller page; these names are SNES logical buttons.
